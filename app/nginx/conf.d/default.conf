# Runs behind an AWS ALB. TLS and the HTTP->HTTPS redirect are handled by the ALB.
# This server speaks plain HTTP on 8080 only.

limit_req_zone $binary_remote_addr zone=global_limit:10m rate=15r/s;

# Recover the real client IP from the ALB's X-Forwarded-For.
# Only trust private ranges (ALB inside the VPC, or the docker network locally).
# In AWS, the instance security group must only allow the ALB to reach port 8080.
set_real_ip_from 10.0.0.0/16;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Pass through the scheme the client used (set by the ALB); fall back to $scheme locally.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream backend_app {
    # No ip_hash: stickiness is not a design, it hides the shared-state problem.
    # Locally "app" resolves to all replicas; on EC2 it is the single local container.
    server app:1234;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    client_max_body_size 10m;
    # Must stay above the ALB idle timeout (60s default), otherwise nginx closes
    # idle connections first and the ALB returns sporadic 502s.
    keepalive_timeout 75s;

    # Raise max-age only after HTTPS is verified everywhere on the domain.
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript image/svg+xml;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;

    # Proxy settings inherited by every proxying location below.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_connect_timeout 5s;

    limit_req_status 429;
    error_page 502 503 504 /50x.html;
    error_page 413 /413.html;
    error_page 429 /429.html;

    location = /50x.html { root /var/www/errors; internal; }
    location = /413.html { root /var/www/errors; internal; }
    location = /429.html { root /var/www/errors; internal; }

    # ALB health check target. Proxied to the app so it reflects real app health.
    # Not rate limited, not logged.
    location = /health {
        access_log off;
        proxy_pass http://backend_app;
    }

    # Static assets: served by nginx, outside the rate limit.
    # "expires" (not add_header) so the security headers above are still inherited.
    # Filenames are unversioned, so keep the cache short.
    location ~ ^/(css|js|assets)/ {
        root /var/www/public;
        try_files $uri =404;
        expires 1h;
        access_log off;
    }

    location / {
        limit_req zone=global_limit burst=30 nodelay;
        proxy_pass http://backend_app;
    }
}