version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /app/docker
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /app/nginx/Docker
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directories:
      - /terraform/bootstrap
      - /terraform/envs/shared
      - /terraform/envs/dev
    schedule:
      interval: weekly
